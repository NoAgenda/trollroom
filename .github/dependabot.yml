version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: express
        versions: [">= 5.0.0"]
      - dependency-name: "@types/express"
        versions: [">= 5.0.0"]
